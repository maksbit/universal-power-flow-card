name: Release independent Home Assistant card
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Show runner identity
        run: echo "runner_name=${RUNNER_NAME}; host=$(hostname)"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --legacy-peer-deps --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Read package version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Verify explicit version tag (if tag-triggered)
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v${{ steps.version.outputs.version }}" = "$GITHUB_REF_NAME"
      - name: Publish HACS-compatible JS asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Universal Power Flow Card v${{ steps.version.outputs.version }}
          files: dist/universal-power-flow-card.js
          generate_release_notes: true
