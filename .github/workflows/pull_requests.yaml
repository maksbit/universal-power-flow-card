name: CI - typecheck, unit tests and build
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    # Never execute untrusted fork PR code on a persistent self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Show runner identity
        run: |
          echo "runner_name=${RUNNER_NAME}"
          echo "runner_os=${RUNNER_OS}"
          echo "host=$(hostname)"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install
        run: npm install --legacy-peer-deps --ignore-scripts
      - name: TypeScript
        run: npm run typecheck
      - name: Model tests
        run: npm test
      - name: Build distinct HACS resource
        run: npm run build
      - name: Browser E2E (click, drag, delete, HA config echoes)
        run: |
          docker run --rm --init --ipc=host --user "$(id -u):$(id -g)" \
            -v "$PWD:/work" -w /work \
            mcr.microsoft.com/playwright:v1.56.1-noble \
            node tests/editor-browser.mjs
      - name: Assert independently named component
        run: |
          test -s dist/universal-power-flow-card.js
          ! grep -q 'customElements.define("sunsynk-power-flow-card"' dist/universal-power-flow-card.js
      - name: Upload test bundle
        uses: actions/upload-artifact@v4
        with:
          name: universal-power-flow-card-preview
          path: dist/universal-power-flow-card.js
