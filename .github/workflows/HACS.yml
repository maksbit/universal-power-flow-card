name: HACS Action
# This frontend is distributed as a GitHub Release JS asset, not a tracked dist file.
# HACS validates the latest published release; running before release cannot pass.
on:
  workflow_run:
    workflows: ['Release independent Home Assistant card']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-hacs:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify Docker on Proxmox self-hosted runner
        run: |
          echo "runner_name=${RUNNER_NAME}; host=$(hostname)"
          docker info --format 'Docker server: {{.ServerVersion}}'
      - name: HACS validation of published JS
        uses: hacs/action@main
        with:
          category: plugin
          # GitHub repository description/topics require one-time Settings metadata entry.
          ignore: 'description topics'
